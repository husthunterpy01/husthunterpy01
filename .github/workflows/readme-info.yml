name: README Info Update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    name: GitHub README Generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The upstream Docker action no longer builds (it pins matplotlib 3.3.0)
      # and hardcodes the "master" branch. Run the same code directly with only
      # the dependencies it actually imports, pointed at "main".
      - name: Fetch and patch github-readme-info
        run: |
          mkdir readme-info && cd readme-info
          for f in GenerateREADME.py githubQuery.py ReadmeMaker.py utility.py; do
            curl -fsSL -o "$f" "https://raw.githubusercontent.com/th3c0d3br34ker/github-readme-info/master/$f"
          done
          sed -i 's/"master"/"main"/g; s/'"'"'master'"'"'/'"'"'main'"'"'/g' GenerateREADME.py githubQuery.py
          # GitHub returns null entries for repos the token can't see; skip them.
          sed -i "s/if d\['isFork'\] is False/if d and d['isFork'] is False/" GenerateREADME.py
          # Read commit history from each repo's default branch (main or master).
          sed -i 's/ref(qualifiedName: "main") {/ref: defaultBranchRef {/' githubQuery.py
          # The language query asks for collaborator counts, which needs admin rights on every repo and fails otherwise.
          sed -i '/collaborators {/,/}/d' githubQuery.py
          # Skip repos GitHub returns as null (ones this token cannot access) in the language count.
          sed -i "s/if repo\['node'\]\['primaryLanguage'\] is None:/if repo['node'] is None or repo['node']['primaryLanguage'] is None:/" GenerateREADME.py
          # The progress bars are images from via.placeholder.com, which is unreliable; use text bars instead.
          sed -i 's|^    done_block = .*|    done_block = "█" * round(pc_rnd / 5)|; s|^    empty_block = .*|    empty_block = "░" * (20 - round(pc_rnd / 5))|' utility.py
          # The script swallows its own errors and exits 0; make failures show up as a red run.
          sed -i 's/print("ERROR:: ", str(e))/print("ERROR:: ", str(e)); raise SystemExit(1)/' GenerateREADME.py
          pip install PyGithub python-dotenv humanize pytz requests

      - name: Check GH_TOKEN secret
        env:
          TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::GH_TOKEN secret is empty or missing. Add it under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" https://api.github.com/user)
          echo "GitHub API /user returned HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::GH_TOKEN was rejected (HTTP $code). Create a new token with repo and user scopes."
            exit 1
          fi

      - name: Generate README stats
        working-directory: readme-info
        env:
          INPUT_GH_TOKEN: ${{ secrets.GH_TOKEN }}
          INPUT_TIMEZONE: "Australia/Perth"
          INPUT_SHOW_LINES_OF_CODE: "True"
          INPUT_SHOW_PROFILE_VIEWS: "False"
          INPUT_SHOW_DAILY_COMMIT: "True"
          INPUT_SHOW_WEEKLY_COMMIT: "True"
          INPUT_SHOW_LANGUAGE: "True"
          INPUT_SHOW_TOTAL_CONTRIBUTIONS: "True"
        run: python GenerateREADME.py
