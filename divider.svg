<svg xmlns="http://www.w3.org/2000/svg" width="900" height="6" viewBox="0 0 900 6" role="presentation">
<defs>
<linearGradient id="g" x1="0" x2="1" y1="0" y2="0" gradientUnits="objectBoundingBox">
<stop offset="0" stop-color="#36BCF7"/><stop offset="0.25" stop-color="#a855f7"/><stop offset="0.5" stop-color="#36BCF7"/><stop offset="0.75" stop-color="#a855f7"/><stop offset="1" stop-color="#36BCF7"/>
</linearGradient>
<clipPath id="c"><rect width="900" height="3" y="1.5" rx="1.5"/></clipPath>
<style>
.bar{animation:slide 6s linear infinite}
@keyframes slide{from{transform:translateX(-900px)}to{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){.bar{animation:none}}
</style>
</defs>
<g clip-path="url(#c)"><rect class="bar" width="1800" height="6" fill="url(#g)"/></g>
</svg>